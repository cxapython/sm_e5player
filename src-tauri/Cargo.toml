[package]
name = "sm-arrow-player"
version = "0.1.0"
description = "E舞成名SM谱面播放器 - Rust + Tauri 重构版"
authors = ["SM Arrow Player Team"]
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
rodio = { version = "0.19", default-features = false, features = ["mp3"] }
anyhow = "1"
thiserror = "1"
lazy_static = "1"
parking_lot = "0.12"
dirs = "5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
